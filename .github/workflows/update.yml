name: Europulse frissítése
on:
  schedule:
    - cron: "17 6 * * 1-5"   # hétköznap ~07:17 London (télen 06:17 UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: europulzus-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install anthropic
      - name: Frissítés
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py
      - name: Commit és push
        run: |
          if git diff --quiet -- index.html; then echo "Nincs változás"; exit 0; fi
          git config user.name "europulzus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update Europulse $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
